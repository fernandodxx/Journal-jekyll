<header class="site-header-minimal">
  <div class="header-container-minimal">
    <a href="{{ '/index' | relative_url }}" class="site-logo-link" aria-label="Fernando, página inicial">
      <span class="site-logo-mark" aria-hidden="true">F</span>
      <span class="site-logo-text" aria-hidden="true">Fernando<span class="site-logo-dot">.</span></span>
    </a>

    <nav class="site-nav-minimal" aria-label="Principal">
      <ul>
        <li>
          <a href="{{ '/index' | relative_url }}"{% if page.home or page.post %} aria-current="page"{% endif %}>JOURNAL</a>
        </li>
        <li>
          <a href="{{ '/archive/' | relative_url }}"{% if page.archive %} aria-current="page"{% endif %}>ARCHIVE</a>
        </li>
        <li>
          <a href="{{ '/portfolio' | relative_url }}"{% if page.portfolio %} aria-current="page"{% endif %}>PORTFOLIO</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
