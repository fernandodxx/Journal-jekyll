<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }} · {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  {%- assign desc = page.description | default: site.description -%}
  {%- if desc %}
  <meta name="description" content="{{ desc | escape }}">
  {%- endif %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax-dracula.css' | relative_url }}">
  {% feed_meta %}
</head>

<body>
  {% include header.html %}
  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}


  <script src="{{ '/assets/js/copy-code.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/toc.js' | relative_url }}"></script>
  <script src="https://unpkg.com/scrollreveal"></script>
  <script src="{{ '/assets/js/portfolio-animations.js' | relative_url }}"></script>
</body>
</html>
